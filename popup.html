<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat Copier</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <header class="header">
      <span class="app-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 6.4A3.4 3.4 0 0 1 8.4 3h7.2A3.4 3.4 0 0 1 19 6.4v6.8a3.4 3.4 0 0 1-3.4 3.4H9l-4 3v-6.4Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 8.4h6M9 11.6h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </span>
      <span>
        <h1>Chat Copier</h1>
        <p class="subtitle">WhatsApp Web → ChatGPT</p>
      </span>
    </header>

    <section class="chat-status" aria-label="Current chat">
      <span class="status-dot" id="status-dot" aria-hidden="true"></span>
      <div class="status-lines">
        <div class="status-label">CURRENT TAB</div>
        <div class="status-detail" id="tab-name">Checking for WhatsApp Web...</div>
      </div>
    </section>

    <div class="field">
      <label for="message-limit">How much chat history?</label>
      <select id="message-limit">
        <option value="50">Last 50 messages</option>
        <option value="100" selected>Last 100 messages</option>
        <option value="250">Last 250 messages</option>
        <option value="500">Up to 500 messages</option>
      </select>
      <div class="hint">Scrolls through older messages when needed. Cannot access deleted messages.</div>
    </div>

    <div class="field">
      <label for="instructions">What should your reply say? <span class="optional">Optional</span></label>
      <textarea id="instructions" rows="3" placeholder="e.g. Confirm installation for Friday at 8am. Keep it short and friendly."></textarea>
    </div>

    <button class="primary-btn" id="copy-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8" y="8" width="11" height="12" rx="2" stroke="currentColor" stroke-width="1.9"/><path d="M16 8V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h1" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      <span>Copy for ChatGPT</span>
    </button>
    <button class="secondary-btn" id="open-btn" type="button">
      Copy and open ChatGPT <span aria-hidden="true">↗</span>
    </button>

    <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

    <details id="preview-section" class="preview" hidden>
      <summary>Preview copied text</summary>
      <textarea id="preview-text" spellcheck="false" readonly aria-label="Copied prompt preview"></textarea>
    </details>
    <p class="privacy">Only reads the chat you open. Nothing is sent to a server by this extension.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
